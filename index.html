<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Trainer</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Memory Trainer</h1>

<div class="panel">

<label>Number Count</label>

<select id="count">

<option>20</option>
<option>30</option>
<option>50</option>
<option>100</option>
<option>200</option>

</select>

<label>Speed</label>

<select id="speed">
   <option value="7000">9 sec</option> 
<option value="5000">7 sec</option>
<option value="5000">5 sec</option>
<option value="4000">4 sec</option>
<option value="3000">3 sec</option>
<option value="2000">2 sec</option>
<option value="1500">1.5 sec</option>
<option value="1000">1 sec</option>
<option value="700">0.7 sec</option>
<option value="500">0.5 sec</option>
<option value="300">0.3 sec</option>

</select>

<button id="start">

Start

</button>

</div>

<div id="screen"></div>

<div class="progress">
    <div class="bar" id="bar"></div>
</div>

<div id="answerArea"></div>

</div>

<script src="script.js"></script>

</body>

  </html>
